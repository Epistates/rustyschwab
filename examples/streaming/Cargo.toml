[package]
name = "streaming-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustyschwab = { path = "../../crates/rustyschwab", features = ["full"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }

[features]
default = ["callback-server"]
callback-server = ["rustyschwab/callback-server"]

[[bin]]
name = "streaming_demo"
path = "src/bin/demo.rs"

[[bin]]
name = "streaming_quotes"
path = "src/bin/quotes.rs"

[[bin]]
name = "streaming_processing"
path = "src/bin/processing.rs"
