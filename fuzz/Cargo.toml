[package]
name = "schwab-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Not a workspace member: cargo-fuzz builds with nightly and sanitizer
# flags of its own. Run with `cargo +nightly fuzz run <target>`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
rustyschwab-types = { path = "../crates/rustyschwab-types" }

[[bin]]
name = "stream_frame"
path = "fuzz_targets/stream_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "order_request"
path = "fuzz_targets/order_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "broker_response"
path = "fuzz_targets/broker_response.rs"
test = false
doc = false
bench = false
