[workspace]
members = [
    "crates/schwab-rs",
    "crates/schwab-types",
    "crates/schwab-mcp",
    "examples/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nick Paterno"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/epistates/rustyschwab"
homepage = "https://github.com/epistates/rustyschwab"
documentation = "https://docs.rs/schwab-rs"
readme = "README.md"
keywords = ["schwab", "trading", "api", "finance", "market-data"]
categories = ["api-bindings", "finance"]

[workspace.dependencies]
# Random number generation (for jitter in backoff)
rand = "0.10"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls"] }
futures-util = "0.3"
async-trait = "0.1"

# HTTP and networking
reqwest = { version = "0.13", features = ["json", "rustls", "cookies", "stream", "form", "query"] }
hyper = "1.9"
url = "2.5"
headers = "0.4"
axum = "0.8"
urlencoding = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_with = "3.17"

# OAuth2
oauth2 = "5.0"
base64 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tracing (structured observability)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics facade + Prometheus exporter.
# The SDK only depends on the `metrics` facade (no-op when no recorder is
# installed); the MCP binary pulls in the Prometheus exporter and
# spawns its own scrape listener when `SCHWAB_METRICS_BIND` is set.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Time and date
chrono = { version = "0.4", features = ["serde"] }
humantime-serde = "1.1"

# Utilities
once_cell = "1.21"
parking_lot = "0.12"
pin-project = "1.1"
bytes = "1.11"
uuid = { version = "1.23", features = ["v4", "serde"] }

# Rate limiting
governor = "0.10"
tower = "0.5"

# Security - Best-in-class 2026
ring = "0.17"
rustls = "0.23"
webpki-roots = "1.0"
# Encryption at rest (ChaCha20Poly1305 AEAD - audited by NCC Group)
chacha20poly1305 = "0.10"
# Cross-platform secure credential storage
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
# Memory-safe secret handling with automatic zeroization
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive", "aarch64"] }

# CLI and configuration
clap = { version = "4.6", features = ["derive", "env"] }
config = "0.15"
dotenvy = "0.15"

# Testing
wiremock = "0.6"
tempfile = "3.27"

# MCP server framework (path dep — local checkout at ../turbomcp)
turbomcp = { path = "../turbomcp/crates/turbomcp", version = "3.1", default-features = false }

# JSON-Schema for MCP tool parameter schemas (must match turbomcp's schemars version)
schemars = { version = "1.0", features = ["chrono04"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
