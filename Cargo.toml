[workspace]
members = [
    "crates/rustyschwab",
    "crates/rustyschwab-types",
    "crates/rustyschwab-mcp",
    "examples/*",
]
# cargo-fuzz targets build on their own (nightly, sanitizers); the Python
# bindings are built by maturin with a Python toolchain and keep their own
# lockfile (see crates/schwab-py/Cargo.toml).
exclude = ["fuzz", "crates/schwab-py"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nick Paterno"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/epistates/rustyschwab"
homepage = "https://github.com/epistates/rustyschwab"
documentation = "https://docs.rs/rustyschwab"
readme = "README.md"
keywords = ["schwab", "trading", "api", "finance", "market-data"]
categories = ["api-bindings", "finance"]

[workspace.dependencies]
# Random number generation (for jitter in backoff)
rand = "0.10"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
# TLS backends are chosen per crate (rustyschwab `rustls` / `native-tls`
# features), never here: a backend listed at the workspace level is on for
# every consumer and makes the other feature meaningless.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = "0.3"
async-trait = "0.1"

# HTTP and networking
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "query", "charset", "http2", "system-proxy"] }
url = "2.5"
axum = "0.8"
# TLS for the local OAuth callback server (Schwab requires an https
# callback URL, so the capture server must terminate TLS itself).
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
urlencoding = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.17"

# Encoding
base64 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tracing (structured observability)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics facade + Prometheus exporter.
# The SDK only depends on the `metrics` facade (no-op when no recorder is
# installed); the MCP binary pulls in the Prometheus exporter and
# spawns its own scrape listener when `SCHWAB_METRICS_BIND` is set.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
# Lets the Prometheus recorder and the OTLP bridge share the one global slot.
metrics-util = { version = "0.20", default-features = false, features = ["layers"] }

# OpenTelemetry (opt-in `otel` feature). These move in lockstep: the 0.33
# API/SDK/OTLP trio, the tracing bridge that targets it (0.34), and the
# `metrics`-facade bridge whose version encodes `0.<metrics><otel>`.
# OTLP goes over HTTP/protobuf on the blocking reqwest client the export
# thread uses, with the rustls stack the workspace already has; the gRPC
# path would add tonic, hyper-util and a second TLS integration.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
    "trace",
    "metrics",
] }
tracing-opentelemetry = { version = "0.34", default-features = false }
metrics-opentelemetry = "0.24033"

# Time and date
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
humantime-serde = "1.1"

# Utilities
parking_lot = "0.12"
uuid = { version = "1.23", features = ["v4", "serde"] }

# Rate limiting
governor = "0.10"
tower = "0.5"

# Security - Best-in-class 2026
ring = "0.17"
# "ring" feature: lets the callback server pick the ring CryptoProvider
# explicitly — both ring and aws-lc-rs end up in the dependency tree, so
# rustls cannot auto-select a process-level provider.
rustls = { version = "0.23", features = ["ring"] }
# The operating system's trust store for the streamer's WebSocket, the same
# verifier reqwest's rustls backend uses for HTTPS.
rustls-platform-verifier = "0.7"
# Encryption at rest (ChaCha20Poly1305 AEAD - audited by NCC Group)
chacha20poly1305 = "0.10"
# Cross-platform secure credential storage
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
# Memory-safe secret handling with automatic zeroization
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive", "aarch64"] }
# Safe POSIX calls for private files: open without following links, check
# the open descriptor, and read the effective user.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

# CLI and configuration
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"

# Testing
wiremock = "0.6"
tempfile = "3.27"

# MCP server framework. Registry dep so the repo builds anywhere; to
# develop against a local checkout, add a `[patch.crates-io]` section:
#   [patch.crates-io]
#   turbomcp = { path = "../turbomcp/crates/turbomcp" }
turbomcp = { version = "=4.0.0-alpha.5", default-features = false }

# JSON-Schema for MCP tool parameter schemas (must match turbomcp's schemars version)
schemars = { version = "1.0", features = ["chrono04"] }

# Shared lint policy; each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
# The one FFI module (Windows file security) allows it locally.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
# Every public type can be printed (with secrets redacted by hand).
missing_debug_implementations = "warn"
# `docsrs` is set by docs.rs (see each crate's `package.metadata.docs.rs`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
