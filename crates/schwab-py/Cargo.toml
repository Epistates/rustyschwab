[package]
name = "schwab-py"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nick Paterno"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/epistates/rustyschwab"
homepage = "https://github.com/epistates/rustyschwab"
readme = "README.md"
description = "Python bindings (PyO3 + maturin) for the Schwab SDK, published to PyPI as rustyschwab"
# Shipped as a wheel on PyPI by publish-python.yml, never to crates.io.
publish = false

# Not a member of the root workspace (see its `exclude`): the Python
# toolchain, the PyO3 dependency tree and the cdylib linking rules stay out
# of the SDK's lockfile and out of its Windows/MSRV/coverage jobs. CI builds
# and tests this crate in the `python` job instead.
[workspace]

[lib]
# The importable name is rustyschwab._native (pyproject.toml: module-name).
name = "_native"
crate-type = ["cdylib"]

[dependencies]
schwab-rs = { path = "../schwab-rs", version = "0.2.0", default-features = false, features = ["rustls"] }
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "auto-initialize"] }
# Only for `StatusCode` in error-conversion tests; the SDK already links it.
reqwest = { version = "0.13", default-features = false }

# The workspace's lint policy (the root Cargo.toml's [workspace.lints]),
# repeated because a crate outside the workspace cannot inherit it.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
