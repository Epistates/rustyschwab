[build-system]
# 1.9.4 is the first maturin that sets PYO3_BUILD_EXTENSION_MODULE, which
# replaces PyO3's deprecated `extension-module` cargo feature.
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "rustyschwab"
description = "Asyncio-native Python bindings for the rustyschwab Schwab SDK: Trader and Market Data APIs, streaming, journaled orders and an offline paper venue"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Nick Paterno" }]
keywords = ["schwab", "trading", "asyncio", "market-data", "streaming", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# The scheduler's time zones come from the standard library's zoneinfo, which
# has no time zone database on Windows.
dependencies = ["tzdata; sys_platform == 'win32'"]
# The version comes from Cargo.toml.
dynamic = ["version"]

[project.scripts]
rustyschwab = "rustyschwab.__main__:main"

[project.urls]
Homepage = "https://github.com/epistates/rustyschwab"
Documentation = "https://github.com/epistates/rustyschwab/blob/main/docs/PYTHON.md"
Repository = "https://github.com/epistates/rustyschwab"
Changelog = "https://github.com/epistates/rustyschwab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.0", "websockets>=14"]
# The NautilusTrader adapter, rustyschwab.nautilus. Developed against the 1.231
# stable line; the range stops before 2.0, a rewrite whose release candidates
# change the adapter interfaces. NautilusTrader supports CPython 3.12 to 3.14
# only, and is LGPL-3.0, which is why it is an extra and not a dependency.
nautilus = ["nautilus_trader>=1.231,<2"]

[tool.maturin]
module-name = "rustyschwab._native"
python-source = "python"
# One abi3 wheel per platform covers every CPython from 3.10.
# (abi3-py310 is enabled on the pyo3 dependency in Cargo.toml.)
include = [{ path = "LICENSE-*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

# NautilusTrader is compiled Cython with no stubs, so mypy cannot see most of
# it. Its names are Any for mypy, installed or not, so the check gives the same
# answer with and without the extra. Subclassing them is allowed in the adapter
# package alone; `mypy --strict python/rustyschwab` stays strict for everything
# else.
[[tool.mypy.overrides]]
module = ["nautilus_trader", "nautilus_trader.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["rustyschwab.nautilus", "rustyschwab.nautilus.*"]
disallow_subclassing_any = false
