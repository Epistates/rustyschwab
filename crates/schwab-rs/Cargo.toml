[package]
name = "schwab-rs"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
keywords = { workspace = true }
categories = { workspace = true }
description = "Production-grade Rust SDK for Charles Schwab Trading and Market Data APIs"

[dependencies]
schwab-types = { path = "../schwab-types", version = "0.1.0" }
schemars = { workspace = true, optional = true }

# Random number generation (for jitter in backoff)
rand = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# HTTP and networking
reqwest = { workspace = true }
hyper = { workspace = true }
url = { workspace = true }
headers = { workspace = true }
axum = { workspace = true, optional = true }
urlencoding = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_with = { workspace = true }

# Auth and encoding
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time and date
chrono = { workspace = true }
humantime-serde = { workspace = true }

# Utilities
once_cell = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }

# Security
ring = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
chacha20poly1305 = { workspace = true }
keyring = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }

# Configuration
config = { workspace = true }
dotenvy = { workspace = true }

# Rate limiting and retry
governor = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["rustls"]
rustls = ["reqwest/rustls", "tokio-tungstenite/rustls"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
callback-server = ["axum"]
# JSON-Schema derives on SchwabClient param structs (PriceHistoryParams, OptionChainParams)
# so the schwab-mcp crate can expose them as strongly-typed MCP tool arguments.
schemars = ["dep:schemars", "schwab-types/schemars"]
full = ["rustls", "callback-server", "schemars"]
