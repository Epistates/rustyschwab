[package]
name = "schwab-rs"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
keywords = { workspace = true }
categories = { workspace = true }
description = "Production-grade Rust SDK for Charles Schwab Trading and Market Data APIs"

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rust_decimal = { version = "1.43", features = ["serde"] }
schwab-types = { path = "../schwab-types", version = "0.2.0" }

# Random number generation (for jitter in backoff)
rand = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# HTTP and networking
reqwest = { workspace = true }
url = { workspace = true }
headers = { workspace = true }
axum = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
urlencoding = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Auth and encoding
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Metrics facade — no-op when no recorder is installed, so this doesn't
# force any runtime overhead on SDK-only consumers.
metrics = { workspace = true }

# Time and date
chrono = { workspace = true }
chrono-tz = { workspace = true }
humantime-serde = { workspace = true }

# Utilities
once_cell = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

# Security
ring = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true }
keyring = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }

# Configuration
config = { workspace = true }

# Rate limiting and retry
governor = { workspace = true }

[dev-dependencies]
# Paused-clock tests (`#[tokio::test(start_paused = true)]`).
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
tempfile = { workspace = true }
# Live conformance harness loads `.env` like the binaries do.
dotenvy = { workspace = true }

[features]
default = ["rustls"]
# The streamer's WebSocket gets an explicit rustls configuration (ring
# provider, platform verifier): both ring and aws-lc-rs are in the tree, so
# rustls cannot pick a process-level provider on its own. The tungstenite
# roots feature only compiles in its rustls connector; its roots go unused.
rustls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
    "dep:rustls",
    "dep:rustls-platform-verifier",
]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
callback-server = ["dep:axum", "dep:axum-server", "dep:rcgen", "dep:rustls"]
# JSON-Schema derives on the schwab-types request structs (PriceHistoryParams,
# OptionChainParams, OrderRequest, ...) so the schwab-mcp crate can expose them
# as strongly-typed MCP tool arguments.
schemars = ["schwab-types/schemars"]
full = ["rustls", "callback-server", "schemars"]

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# Used by serde(with) attributes in configuration types.
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
