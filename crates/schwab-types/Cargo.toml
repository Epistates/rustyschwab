[package]
name = "schwab-types"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/schwab-types"
readme = "README.md"
description = "Type definitions for Schwab Trading and Market Data APIs"

[lints]
workspace = true

[dependencies]
rust_decimal = { version = "1.43", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
default = []
# Derive `schemars::JsonSchema` on public input types used by the schwab-mcp crate
# so MCP tool parameters get auto-generated JSON schemas.
schemars = ["dep:schemars"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1.11"
