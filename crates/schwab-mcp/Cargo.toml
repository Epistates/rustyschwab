[package]
name = "schwab-mcp"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
description = "MCP server exposing the Schwab Trading + Market Data SDK as tools"

[lib]
name = "schwab_mcp"
path = "src/lib.rs"

[[bin]]
name = "schwab-mcp"
path = "src/main.rs"

[dependencies]
turbomcp = { workspace = true, features = ["stdio", "http", "websocket"] }
schwab-rs = { path = "../schwab-rs", features = ["schemars"] }
schwab-types = { path = "../schwab-types", features = ["schemars"] }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
