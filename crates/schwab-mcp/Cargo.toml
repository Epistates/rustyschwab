[package]
name = "schwab-mcp"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
readme = "README.md"
description = "MCP server exposing the Schwab Trading + Market Data SDK as tools"

[lints]
workspace = true

[lib]
name = "schwab_mcp"
path = "src/lib.rs"

[[bin]]
name = "schwab-mcp"
path = "src/main.rs"

[dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { version = "10.4", features = ["aws_lc_rs"] }
reqwest = { workspace = true, features = ["rustls"] }
rust_decimal = { version = "1.43", features = ["serde"] }
turbomcp = { workspace = true, features = ["stdio", "http", "websocket"] }
schwab-rs = { path = "../schwab-rs", version = "0.2.0", features = ["schemars"] }
schwab-types = { path = "../schwab-types", version = "0.2.0", features = ["schemars"] }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
ring = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true, features = ["util"] }
futures-util = { workspace = true }
subtle = "2.6"
turbomcp-core = "3.3"

[dev-dependencies]
wiremock = { workspace = true }
tokio-tungstenite = { workspace = true }

# Required by the generated MCP schemas.
[package.metadata.cargo-machete]
ignored = ["schemars"]
