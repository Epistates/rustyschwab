[package]
name = "rustyschwab"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
keywords = { workspace = true }
categories = { workspace = true }
description = "Unofficial Rust SDK for the Charles Schwab Trader and Market Data APIs: OAuth, REST, streaming, journaled orders, risk limits and a paper venue"

[lints]
workspace = true

# docs.rs documents every feature, marking feature-gated items as such.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rust_decimal = { version = "1.43", features = ["serde"] }
rustyschwab-types = { path = "../rustyschwab-types", version = "0.2.0" }

# Random number generation (for jitter in backoff)
rand = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# HTTP and networking
reqwest = { workspace = true }
url = { workspace = true }
axum = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
urlencoding = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Auth and encoding
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing (the subscriber only for the optional `telemetry` helpers)
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

# OTLP export for the optional `otel` feature.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
metrics-opentelemetry = { workspace = true, optional = true }

# Metrics facade — no-op when no recorder is installed, so this doesn't
# force any runtime overhead on SDK-only consumers.
metrics = { workspace = true }

# Time and date
chrono = { workspace = true }
chrono-tz = { workspace = true }
humantime-serde = { workspace = true }

# Utilities
parking_lot = { workspace = true }
uuid = { workspace = true }

# Security
ring = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true }
keyring = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }


# Rate limiting and retry
governor = { workspace = true }

[dev-dependencies]
# Paused-clock tests (`#[tokio::test(start_paused = true)]`).
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
# In-memory span/metric exporters for the `otel` tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
# Live conformance harness loads `.env` like the binaries do.
dotenvy = { workspace = true }

[features]
default = ["rustls", "telemetry"]
# `rustyschwab::telemetry`: ready-made tracing-subscriber setups. Off, the SDK
# only emits `tracing` events and the application installs its subscriber.
telemetry = ["dep:tracing-subscriber"]
# `rustyschwab::telemetry::init_otel`: exports spans (and, through the `metrics`
# facade, metrics) over OTLP/HTTP when the standard OTEL_* environment names
# an endpoint. Off by default; no OpenTelemetry code is compiled without it.
otel = [
    "telemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:metrics-opentelemetry",
]
# The streamer's WebSocket gets an explicit rustls configuration (ring
# provider, platform verifier): both ring and aws-lc-rs are in the tree, so
# rustls cannot pick a process-level provider on its own. The tungstenite
# roots feature only compiles in its rustls connector; its roots go unused.
rustls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
    "dep:rustls",
    "dep:rustls-platform-verifier",
]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
callback-server = ["dep:axum", "dep:axum-server", "dep:rcgen", "dep:rustls"]
# JSON-Schema derives on the rustyschwab-types request structs (PriceHistoryParams,
# OptionChainParams, OrderRequest, ...) so the schwab-mcp crate can expose them
# as strongly-typed MCP tool arguments.
schemars = ["rustyschwab-types/schemars"]
full = ["rustls", "callback-server", "schemars", "telemetry"]

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# Used by serde(with) attributes in configuration types.
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
