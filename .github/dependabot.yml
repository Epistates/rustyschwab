version: 2
updates:
  # Three lockfiles: the workspace, the Python bindings (outside the
  # workspace) and the fuzz targets. Compatible updates arrive as one pull
  # request across all three; a major update, as one pull request per crate.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/schwab-py
      - /fuzz
    schedule:
      interval: weekly
    # A release takes no crate version under seven days old, so none is
    # proposed before then; a crate that publishes several fixes in a week
    # arrives once. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      compatible-rust-updates:
        update-types: [minor, patch]
      major-rust-updates:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name
  - package-ecosystem: pip
    directory: /crates/schwab-py
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compatible-python-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # An action runs in CI, with the repository's tokens, as soon as its
    # update merges, so a new release waits a week before it is proposed.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      compatible-action-updates:
        update-types: [minor, patch]
