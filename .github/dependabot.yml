version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-rust-updates:
        update-types: [minor, patch]
  # The Python bindings are outside the workspace, with their own lockfile.
  - package-ecosystem: cargo
    directory: /crates/schwab-py
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-rust-updates:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /crates/schwab-py
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # An action runs in CI, with the repository's tokens, as soon as its
    # update merges, so a new release waits a week before it is proposed.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
