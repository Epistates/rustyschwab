version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-rust-updates:
        update-types: [minor, patch]
    ignore:
      # 0.13 needs Rust 1.95; the MSRV is 1.89. Drop this when the MSRV moves.
      - dependency-name: parking_lot
        versions: [">=0.13.0"]
  # The Python bindings are outside the workspace, with their own lockfile.
  - package-ecosystem: cargo
    directory: /crates/schwab-py
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-rust-updates:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /crates/schwab-py
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
