name: Publish Python

# Builds the `rustyschwab` wheels and sdist from crates/schwab-py. A `v*` tag
# builds everything and, after approval in the `pypi` environment, publishes
# it to PyPI with trusted publishing (OIDC), so no long-lived PyPI token
# exists. Run by hand (workflow_dispatch) it builds the same artifacts without
# publishing, to inspect them before tagging.
#
# One abi3 wheel per platform covers CPython 3.10 and every later release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: tag matches the crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Versions agree
        run: |
          bindings=$(cargo metadata --format-version 1 --no-deps --manifest-path crates/schwab-py/Cargo.toml | jq -r '.packages[0].version')
          sdk=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rustyschwab") | .version')
          [ "$bindings" = "$sdk" ] || { echo "::error::schwab-py is $bindings but rustyschwab is $sdk"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$bindings" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$bindings"; exit 1; }
          fi

  wheels:
    name: wheel (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # manylinux_2_28 builds in the pypa container, so the wheel runs on
          # any glibc 2.28+ distribution. aarch64 builds natively, not under
          # emulation or a cross toolchain (the TLS stack compiles C).
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          # Apple's toolchain cross-compiles to Intel from an arm64 runner.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/schwab-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # aws-lc-sys (the TLS provider) may build with cmake; the pypa
          # image is not guaranteed to ship it. Linux containers only.
          before-script-linux: command -v cmake >/dev/null || yum install -y cmake
          args: --release --locked --out dist
      # Only wheels this runner can execute are smoke-tested; the Intel macOS
      # wheel is built here but cannot run on an arm64 runner.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.name != 'macos-x86_64'
        with:
          python-version: "3.12"
      - name: Smoke test the wheel
        if: matrix.name != 'macos-x86_64'
        shell: bash
        working-directory: crates/schwab-py
        run: |
          python -m pip install --no-index --find-links dist rustyschwab
          python -c "import rustyschwab; print(rustyschwab.__version__, rustyschwab.__sdk_version__); rustyschwab.stream_fields('LEVELONE_EQUITIES')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.name }}
          path: crates/schwab-py/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The sdist bundles rustyschwab and rustyschwab-types, which the bindings
      # depend on by path, so it builds on its own.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/schwab-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: crates/schwab-py/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Approval here is the release gate. Register this workflow and the
    # `pypi` environment as the trusted publisher of the `rustyschwab`
    # project on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/rustyschwab/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
