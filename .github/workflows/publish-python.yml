name: Publish Python

# Builds the `rustyschwab` wheels and sdist from crates/schwab-py. A `v*` tag
# builds everything and, after approval in the `pypi` environment, publishes
# it to PyPI with trusted publishing (OIDC), so no long-lived PyPI token
# exists. Run by hand (workflow_dispatch) it builds the same artifacts without
# publishing, to inspect them before tagging.
#
# One abi3 wheel per platform covers CPython 3.10 and every later release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: tag matches the crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Versions agree
        run: |
          bindings=$(cargo metadata --format-version 1 --no-deps --manifest-path crates/schwab-py/Cargo.toml | jq -r '.packages[0].version')
          sdk=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rustyschwab") | .version')
          [ "$bindings" = "$sdk" ] || { echo "::error::schwab-py is $bindings but rustyschwab is $sdk"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$bindings" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$bindings"; exit 1; }
          fi

  wheels:
    name: wheel (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # manylinux_2_28 builds in the pypa container, so the wheel runs on
          # any glibc 2.28+ distribution. aarch64 builds natively, not under
          # emulation or a cross toolchain (the TLS stack compiles C).
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          # Apple's toolchain cross-compiles to Intel from an arm64 runner.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/schwab-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # aws-lc-sys (the TLS provider) may build with cmake; the pypa
          # image is not guaranteed to ship it. Linux containers only.
          before-script-linux: command -v cmake >/dev/null || yum install -y cmake
          args: --release --locked --out dist
      # Only wheels this runner can execute are smoke-tested; the Intel macOS
      # wheel is built here but cannot run on an arm64 runner.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.name != 'macos-x86_64'
        with:
          python-version: "3.12"
      - name: Smoke test the wheel
        if: matrix.name != 'macos-x86_64'
        shell: bash
        working-directory: crates/schwab-py
        # The wheel's own dependencies (tzdata, on Windows) come pinned with
        # hashes; the wheel goes in without them, and `pip check` confirms
        # the pinned set satisfies what it declares.
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python -c "import rustyschwab; print(rustyschwab.__version__, rustyschwab.__sdk_version__); rustyschwab.stream_fields('LEVELONE_EQUITIES')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.name }}
          path: crates/schwab-py/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The sdist bundles rustyschwab and rustyschwab-types, which the bindings
      # depend on by path, so it builds on its own.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/schwab-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: crates/schwab-py/dist/*.tar.gz
          if-no-files-found: error

  # The test suite against the wheel that is published, not a local build.
  test:
    name: test the Linux wheel
    needs: wheels
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: crates/schwab-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheel-linux-x86_64
          path: crates/schwab-py/dist
      - name: Install the pinned test dependencies and the wheel
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - run: python -m pytest
      - run: python -m mypy --strict python/rustyschwab

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    # Approval here is the release gate: approve once CI and `release.yml`
    # have passed on the tagged commit, which the first step checks.
    # Register this workflow and the `pypi` environment as the trusted
    # publisher of the `rustyschwab` project on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/rustyschwab/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: The tagged commit passed CI and the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml release.yml; do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
            [ "$passed" -gt 0 ] || { echo "::error::$workflow has not passed on $GITHUB_SHA"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
