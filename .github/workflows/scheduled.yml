name: Scheduled quality

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (long)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-fuzz
      # The target is named for the same reason as in ci.yml's fuzz smoke.
      - name: Run each target for ten minutes
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=600
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  # The mutants are spread over eight shards so each finishes well inside a
  # job's six hours (one job took about six and a half).
  mutants:
    name: mutation testing (risk and execution, shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-mutants
      # A mutant that survives in the code deciding whether an order may go
      # is a missing test, so a missed mutant (or a timeout) fails the shard.
      # Round-robin gives every shard a similar share of the slow mutants.
      #
      # cargo-mutants bounds each mutant's time but not its memory, and a
      # mutant that loops while allocating took a runner's 16 GB in about a
      # minute, losing the whole shard. Each test binary runs under a 6 GiB
      # data limit, through a target runner so rustc is unaffected. The runner
      # also leaves a marker for any test binary that dies by a signal, which
      # is what a capped allocation does: the report fails on it, since no
      # test stopped that mutant.
      - env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/.github/scripts/mutant-test-runner.sh
          MUTANT_TEST_MEMORY: "6442450944"
          MUTANT_MARKERS: ${{ runner.temp }}/mutant-markers
        run: >-
          cargo mutants -p rustyschwab --no-shuffle --timeout 300 --in-place
          --shard ${{ matrix.shard }}/8 --sharding round-robin
          --file crates/rustyschwab/src/risk.rs
          --file crates/rustyschwab/src/execution.rs
          --file crates/rustyschwab/src/reconciliation.rs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutant-markers-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutant-markers/
          if-no-files-found: ignore

  # The marker is what makes a capped mutant fail the report, so check it
  # works on every run: a test binary that aborts (as an allocation failure
  # under the cap does) or is killed leaves a marker, and one that passes or
  # fails a test leaves none.
  mutant-runner-selftest:
    name: mutation test runner marks a binary that dies by a signal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Check the runner's markers
        env:
          MUTANT_TEST_MEMORY: "6442450944"
          MUTANT_MARKERS: ${{ runner.temp }}/selftest-markers
        run: |
          runner=.github/scripts/mutant-test-runner.sh
          markers() { find "$MUTANT_MARKERS" -type f 2>/dev/null | wc -l; }
          expect() {
            want_status=$1 want_markers=$2
            shift 2
            "$runner" "$@" && got=0 || got=$?
            if [ "$got" -ne "$want_status" ] || [ "$(markers)" -ne "$want_markers" ]; then
              echo "::error::$*: exit $got and $(markers) markers, expected exit $want_status and $want_markers"
              exit 1
            fi
          }
          printf 'fn main() { let v = vec![1u8; 8 << 30]; println!("{}", v[v.len() - 1]); }\n' > "$RUNNER_TEMP/alloc.rs"
          rustc -O -o "$RUNNER_TEMP/alloc" "$RUNNER_TEMP/alloc.rs"
          expect 0 0 true
          expect 101 0 sh -c 'exit 101'
          expect 134 1 "$RUNNER_TEMP/alloc"
          expect 134 2 sh -c 'kill -ABRT $$'
          expect 137 3 sh -c 'kill -KILL $$'

  # The shards' verdict in one place: it fails unless every shard ran to the
  # end and no mutant survived or timed out, so a shard that died or never
  # reported can't read as cancelled or skipped. A mutant stopped by the
  # memory cap fails it too: the cap only stops a runaway, and a test has to
  # catch it. The summary lists every surviving, timed-out and capped mutant.
  mutants-report:
    name: mutation testing (every shard reported, no survivors)
    needs: [mutants, mutant-runner-selftest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-shard-*
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutant-markers-shard-*
          path: markers
      - name: Check every shard's report
        env:
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          SELFTEST_RESULT: ${{ needs.mutant-runner-selftest.result }}
        run: |
          status=0
          for shard in 0 1 2 3 4 5 6 7; do
            outcomes="reports/mutants-shard-$shard/outcomes.json"
            if [ ! -f "$outcomes" ]; then
              echo "::error::shard $shard left no report"
              status=1
            elif ! jq -e '.caught + .missed + .timeout + .unviable + .success == .total_mutants' "$outcomes" >/dev/null; then
              echo "::error::shard $shard stopped before testing every mutant"
              status=1
            fi
          done
          # The runner's markers: a test binary that died by a signal.
          for marker in $(find markers -type f 2>/dev/null | sort); do
            echo "::error::a test binary died by a signal, no test caught this mutant: $(sed -n '/^mutant:/,$p' "$marker" | grep -E '^(\+\+\+ |@@)' | tr '\n' ' ')"
            status=1
          done
          if [ "$SELFTEST_RESULT" != success ]; then
            echo "::error::the mutation test runner's self-test failed, so a capped mutant might go unmarked"
            status=1
          fi
          # A second check: Rust prints this line when an allocation fails.
          capped=""
          if capped=$(grep -rl --include='*.log' 'memory allocation of .* bytes failed' reports); then
            for log in $capped; do
              echo "::error::a mutant was stopped by the memory cap, no test caught it: $(basename "$log" .log)"
              status=1
            done
          fi
          {
            echo "## Surviving mutants"
            find reports -name missed.txt -exec cat {} + | sort
            echo "## Mutants that timed out"
            find reports -name timeout.txt -exec cat {} + | sort
            echo "## Test binaries that died by a signal"
            find markers -type f -exec cat {} + 2>/dev/null
            echo "## Mutants stopped by the memory cap"
            for log in $capped; do basename "$log" .log; done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MUTANTS_RESULT" != success ]; then
            echo "::error::mutation testing found surviving or timed-out mutants, or a shard failed"
            status=1
          fi
          exit "$status"

  minimal-versions:
    name: minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      # The declared lower bounds must build, not only the locked versions.
      - run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo +nightly check --workspace --all-features
