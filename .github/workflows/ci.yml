name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Actions are pinned to full commit SHAs (tag in the trailing comment);
# Dependabot's github-actions ecosystem keeps both current.
jobs:
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: actionlint
      # Also runs shellcheck (preinstalled on the runner) on every `run:`.
      - run: actionlint

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features --locked

  test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.89.0" # MSRV gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      # rust-toolchain.toml pins the release toolchain; the MSRV row must
      # really build with its own.
      - if: matrix.toolchain != 'stable'
        run: echo "RUSTUP_TOOLCHAIN=${{ matrix.toolchain }}" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      # `--all-targets` excludes doctests, so the examples in doc comments
      # get their own run.
      - run: cargo test --workspace --doc --all-features --locked

  features:
    name: SDK feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check -p rustyschwab --no-default-features --locked
      - run: cargo check -p rustyschwab --no-default-features --features native-tls --locked
      - run: cargo check -p rustyschwab --no-default-features --features callback-server --locked
      - run: cargo check -p rustyschwab-types --no-default-features --locked
      # The OpenTelemetry export is opt-in; the binaries forward the feature.
      - run: cargo check -p rustyschwab --no-default-features --features rustls,otel --locked
      - run: cargo check -p rustyschwab-mcp --bins --features otel --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      # Every feature on its own, not only the combinations above.
      - run: cargo hack check -p rustyschwab -p rustyschwab-types --each-feature --no-dev-deps --locked
      # Choosing native-tls must actually drop rustls from the SDK.
      - name: native-tls build carries no rustls
        run: |
          if cargo tree -p rustyschwab --no-default-features --features native-tls -e normal --prefix none | grep -E '^rustls '; then
            echo "::error::native-tls build still depends on rustls"
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # For the toolchain rust-toolchain.toml pins, which cargo runs.
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # A floor, raised as coverage grows; the report is kept either way.
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info --fail-under-lines 75
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  dependencies:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete
      - run: cargo machete

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      # Short runs on every change; the scheduled workflow runs them long.
      - name: Run each target briefly
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done

  package:
    name: publishable crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Builds each crate from its packaged tarball, as crates.io would.
      - run: cargo package -p rustyschwab-types -p rustyschwab -p rustyschwab-mcp --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
      # The Python bindings are outside the workspace with a lockfile of their own.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: crates/schwab-py/Cargo.toml
          command: check advisories bans licenses sources

  # The Python bindings are not a workspace member (see crates/schwab-py/Cargo.toml),
  # so nothing above builds them. This builds the wheel the way a user installs
  # it and runs the pytest suite against that wheel, on the oldest and newest
  # supported Python (the wheel is abi3, one build for all of them). One row
  # installs the nautilus extra and so runs the NautilusTrader adapter tests,
  # which skip themselves elsewhere. NautilusTrader supports CPython 3.12 to
  # 3.14, so that row is the oldest of those.
  python:
    name: python (${{ matrix.os }} / py${{ matrix.python }}${{ matrix.nautilus && ' + nautilus' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
            nautilus: true
    defaults:
      run:
        shell: bash
        working-directory: crates/schwab-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/schwab-py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Bindings and SDK ship the same version
        run: |
          bindings=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          sdk=$(cargo metadata --format-version 1 --no-deps --manifest-path ../../Cargo.toml | jq -r '.packages[] | select(.name == "rustyschwab") | .version')
          [ "$bindings" = "$sdk" ] || { echo "::error::schwab-py is $bindings but rustyschwab is $sdk"; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Links the interpreter and runs the conversion and error-mapping unit tests.
      - run: cargo test --locked
      - run: python -m pip install "maturin>=1.9.4,<2"
      - run: maturin build --locked --out dist
      - name: Install the wheel with the test extras
        run: python -m pip install "$(echo dist/*.whl)[test${{ matrix.nautilus && ',nautilus' || '' }}]" mypy
      - run: python -m pytest
      # The adapter's tests skip without NautilusTrader, so a row meant to run
      # them must not be able to skip them silently.
      - name: The NautilusTrader adapter tests ran
        if: matrix.nautilus
        run: |
          python -m pytest tests/nautilus -q -rs | tee nautilus-tests.log
          ! grep -q SKIPPED nautilus-tests.log
      - run: python -m mypy --strict python/rustyschwab

  compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The live smoke script's MCP client is tested against this server in
      # paper mode; without the binary that test skips.
      - run: cargo build -p rustyschwab-mcp --bin rustyschwab-mcp --locked
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: cargo build -p enterprise-bench --release --locked
      - run: python3 tools/soak.py --seconds 60 --output soak-fast.json
      - run: python3 tools/soak.py --seconds 60 --consumer-delay-ms 10 --output soak-slow.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-soak-evidence
          path: soak-*.json
