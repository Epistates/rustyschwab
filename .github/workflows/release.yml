name: Release evidence
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  # Every binary the schwab-mcp package ships.
  BINARIES: >-
    schwab-mcp schwab-admin schwab-authority schwab-remote
    schwab-paper schwab-paper-verify schwab-eval
jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-auditable,cargo-audit
      - run: cargo test --workspace --all-targets --all-features --locked
      # Embeds the dependency list in each binary, so `cargo audit bin` can
      # check a deployed artifact against RustSec long after the release.
      - run: cargo auditable build -p schwab-mcp --bins --release --locked
      - name: Stage binaries and SBOM
        run: |
          mkdir -p dist
          for bin in $BINARIES; do cp "target/release/$bin" dist/; done
          # Fail if the package gained a binary this list does not ship.
          built=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "schwab-mcp") | .targets[] | select(.kind[] == "bin") | .name' | sort)
          listed=$(printf '%s\n' $BINARIES | sort)
          [ "$built" = "$listed" ] || { echo "::error::binaries differ: $built vs $listed"; exit 1; }
          python3 tools/sbom.py dist/sbom.cdx.json
          # The embedded audit data must be present and clean.
          for bin in $BINARIES; do cargo audit --deny warnings bin "dist/$bin"; done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-evidence
          path: dist/
