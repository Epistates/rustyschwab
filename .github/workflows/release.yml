name: Release evidence
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  # Every binary the rustyschwab-mcp and rustyschwab-dash packages ship.
  BINARIES: >-
    rustyschwab-mcp rustyschwab-admin rustyschwab-authority rustyschwab-remote
    rustyschwab-paper rustyschwab-paper-verify rustyschwab-eval rustyschwab-dash
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rustyschwab-mcp") | .version')
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - name: The binary list matches the package
        run: |
          built=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rustyschwab-mcp" or .name == "rustyschwab-dash") | .targets[] | select(.kind[] == "bin") | .name' | sort)
          # shellcheck disable=SC2086 # BINARIES is a word list
          listed=$(printf '%s\n' $BINARIES | sort)
          [ "$built" = "$listed" ] || { echo "::error::binaries differ: $built vs $listed"; exit 1; }
      - run: cargo test --workspace --all-targets --all-features --locked

  artifacts:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-auditable,cargo-audit
      # Embeds the dependency list in each binary, so `cargo audit bin` can
      # check a deployed artifact against RustSec long after the release.
      - run: cargo auditable build -p rustyschwab-mcp -p rustyschwab-dash --bins --release --locked --target ${{ matrix.target }}
      - name: Stage binaries, SBOM and checksums
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p dist
          for bin in $BINARIES; do cp "target/$TARGET/release/$bin$EXE" dist/; done
          python3 tools/sbom.py dist/sbom.cdx.json
          # The embedded audit data must be present and clean.
          for bin in $BINARIES; do cargo audit --deny warnings bin "dist/$bin$EXE"; done
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -- * > SHA256SUMS; else shasum -a 256 -- * > SHA256SUMS; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-release-evidence
          path: dist/

  # A tag's evidence becomes a draft GitHub Release, which does not expire
  # as workflow artifacts do; a maintainer reviews and publishes it.
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets
          for dir in dist/*-release-evidence; do
            target=${dir#dist/}
            target=${target%-release-evidence}
            for file in "$dir"/*; do
              cp "$file" "assets/$target-$(basename "$file")"
            done
          done
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes

