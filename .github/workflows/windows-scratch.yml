name: Windows scratch
on:
  push:
    branches: [steward/windows-private-files-scratch]
permissions:
  contents: read
concurrency:
  group: windows-scratch
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
        continue-on-error: true
      - run: cargo test --workspace --doc --all-features --locked --no-fail-fast
