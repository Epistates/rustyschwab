name: diag
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
jobs:
  loop:
    name: loop ${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: diag
      - run: cargo test -p rustyschwab --test audit_chain --locked --no-run
        shell: bash
      - name: Loop
        shell: bash
        run: |
          fail=0
          for i in $(seq 1 ${LOOPS:-30}); do
            if cargo test -p rustyschwab --test audit_chain --locked -- --nocapture > out.txt 2>&1; then r=ok; else r=FAILED; fail=$((fail+1)); fi
            echo "RUN $i $r"
            grep -E "DIAG|panicked|^test concurrent" out.txt || true
          done
          echo "SUMMARY shard=${{ matrix.shard }} failures=$fail"
