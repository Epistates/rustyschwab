# Supply-chain policy, enforced in CI by `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec vulnerability, unmaintained, unsound and yanked finding fails
# the build. Accepting one requires an entry here with its reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses present in the dependency graph. Adding one is a
# reviewed change, not a side effect of a dependency update.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Duplicate major versions are visible but tolerated: most come from the
# windows-sys / rand / hashbrown ecosystems and cannot be unified locally.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies of unpublished crates (the examples).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
